<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anson6118 | 個人主頁</title>
  <meta name="description" content="Anson6118 的現代化個人主頁，具備即時動態時鐘、智慧問候與自訂名片功能。">
  
  <!-- Google Fonts: Outfit & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 背景動態光暈球 -->
  <div class="ambient-background">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="container">
    <!-- 頂部功能導航列 -->
    <header class="top-nav">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span class="status-text" id="status-text">在線 · 專注創作中</span>
      </div>
      
      <div class="nav-actions">
        <!-- 主題切換按鈕 -->
        <button id="theme-toggle" class="icon-btn" title="切換深色/淺色主題" aria-label="切換主題">
          <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>

    <!-- 主要內容區塊 -->
    <main class="main-content">
      <!-- 個人主名片卡片 -->
      <section class="glass-card profile-card" id="profile-card">
        <div class="profile-header">
          <div class="avatar-wrapper">
            <div class="avatar-ring"></div>
            <div class="avatar-image">
              <span class="avatar-emoji" id="avatar-emoji">🚀</span>
            </div>
            <button class="avatar-edit-btn" id="change-avatar-btn" title="切換頭像圖示">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
            </button>
          </div>
          
          <div class="profile-identity">
            <div class="name-container">
              <h1 class="user-name" id="user-name" contenteditable="false" title="點擊右方筆型按鈕編輯姓名">Anson6118</h1>
              <button class="edit-name-btn" id="edit-name-btn" title="編輯名字" aria-label="編輯名字">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
              </button>
            </div>
            <p class="user-bio" id="user-bio" contenteditable="false" title="點擊編輯簡介">
              探索技術、熱愛生活 · 這是我的個人專屬空間
            </p>
          </div>
        </div>

        <div class="tags-container" id="tags-container">
          <span class="tag">💻 開發者</span>
          <span class="tag">🎨 創作者</span>
          <span class="tag">☕ 咖啡愛好者</span>
          <span class="tag">🎵 音樂與生活</span>
        </div>
      </section>

      <!-- 即時時間與問候看板卡片 -->
      <section class="glass-card clock-card" id="clock-card">
        <div class="greeting-banner">
          <span class="greeting-icon" id="greeting-icon">☀️</span>
          <div class="greeting-text-group">
            <span class="greeting-title" id="greeting-text">午安，歡迎回來！</span>
            <span class="greeting-sub" id="greeting-sub">願你有個高效且美好的一天</span>
          </div>
        </div>

        <!-- 數位時鐘本體 -->
        <div class="digital-clock-wrapper">
          <div class="digital-clock" id="digital-clock">
            <span class="clock-unit" id="clock-hours">00</span>
            <span class="clock-colon">:</span>
            <span class="clock-unit" id="clock-minutes">00</span>
            <span class="clock-colon">:</span>
            <span class="clock-unit" id="clock-seconds">00</span>
          </div>
          <div class="clock-period-badge" id="clock-period">AM</div>
        </div>

        <!-- 日期與時區細節 -->
        <div class="date-details">
          <div class="date-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
            <span id="date-display">2026年 09月 16日</span>
          </div>
          <div class="date-divider">·</div>
          <div class="date-item">
            <span id="weekday-display">星期三</span>
          </div>
          <div class="date-divider">·</div>
          <div class="date-item timezone-badge">
            <span id="timezone-display">UTC+8</span>
          </div>
        </div>
      </section>

      <!-- 快速連結與互動區塊 -->
      <section class="glass-card actions-card">
        <h2 class="section-title">快速連結與聯絡</h2>
        <div class="links-grid">
          <a href="https://github.com/Anson6118" target="_blank" rel="noopener noreferrer" class="action-link" id="link-github">
            <div class="link-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
            </div>
            <div class="link-info">
              <span class="link-name">GitHub</span>
              <span class="link-desc">查看開源專案</span>
            </div>
            <span class="link-arrow">→</span>
          </a>

          <a href="mailto:hello@example.com" class="action-link" id="link-email">
            <div class="link-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </div>
            <div class="link-info">
              <span class="link-name">電子郵件</span>
              <span class="link-desc">發送訊息與交流</span>
            </div>
            <span class="link-arrow">→</span>
          </a>

          <div class="action-link interactive-btn" id="copy-time-btn" role="button" tabindex="0">
            <div class="link-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            </div>
            <div class="link-info">
              <span class="link-name">複製目前時間</span>
              <span class="link-desc" id="copy-btn-hint">點擊複製時間戳記</span>
            </div>
            <span class="link-arrow">📋</span>
          </div>

          <div class="action-link interactive-btn" id="random-quote-btn" role="button" tabindex="0">
            <div class="link-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
            </div>
            <div class="link-info">
              <span class="link-name">每日一句靈感</span>
              <span class="link-desc" id="quote-preview">點擊獲取今日啟發</span>
            </div>
            <span class="link-arrow">✨</span>
          </div>
        </div>
      </section>
    </main>

    <!-- 頁尾宣告 -->
    <footer class="footer">
      <p>現代極簡設計 · 隨時點擊名字直接自訂保存 · Built with Vanilla Web Tech</p>
    </footer>
  </div>

  <!-- 浮動輕量提示訊息 (Toast) -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
